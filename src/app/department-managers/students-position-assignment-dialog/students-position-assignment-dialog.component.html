<mat-dialog-content>
  <h2>{{'DEPT-MANAGER.SELECT-COMPANY' | translate}}</h2>
  <table id="tbl" class="table">
    <thead>
      <tr>
        <th scope="col">{{'DEPT-MANAGER.SERIAL-NO' | translate}}</th>
        <th scope="col">{{'DEPT-MANAGER.POSITION' | translate}}</th>
        <th scope="col">{{'DEPT-MANAGER.COMPANY-NAME-LABEL' | translate}}</th>
      </tr>
    </thead>
    <tbody>
      <tr id="{{'tr' + option.app_pos_id}}" (click)="changeSelectedRow(option.app_pos_id, i)"
        [ngClass]="{'selected': selectedRow === option.app_pos_id}" class="hovered"
        *ngFor="let option of this.apps; let i=index">
        <td scope="row">{{i + 1}}</td>
        <td scope="row">{{option.title}}</td>
        <td scope="row">{{option.company}}</td>
      </tr>
    </tbody>
  </table>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="btn btn-secondary" mat-button (click)="onCancel()">{{'GENERIC.BACK' | translate}}</button>
  <button class="btn btn-primary" (click)="onSubmitSwal(this.data.assignMode)" mat-button>{{'HOME.SUBMIT-BTN' | translate}}</button>
</mat-dialog-actions>
