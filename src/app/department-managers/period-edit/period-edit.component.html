<app-department-manager-header></app-department-manager-header>
<section class=" ">
  <!-- <div class="alert alert-success" role="alert">
      Η περίοδος δήλωσης πρακτικής άσκησης είναι από 01/03/2021 έως 20/05/2021.
    </div> -->
  <!-- add period -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">
        <i class="fas fa-plus mr-1"></i>
        {{'DEPT-MANAGER.EDIT-PERIOD' | translate}}
      </h3>
    </div>

    <div class="card-body">
      <div class="tab-content p-0">
        <div class="chart tab-pane active" style="min-height:430px" id="revenue-chart">
          <h5 class="font-weight-normal pt-2 pb-2">{{'DEPT-MANAGER.PERIOD-DETAILS' | translate}}</h5>
          <form ngNativeValidate #periodEditForm="ngForm" (ngSubmit)="onSubmitPeriodEditForm(periodEditForm.value)">
            <div class="form-group row">
              <label for="staticEmail" class="col-sm-2 col-form-label">{{'DEPT-MANAGER.ACADEMIC-SEMESTER' | translate}}</label>
              <div class="col-sm-10">
                <select required class="custom-select" id="semester" name="semester" [(ngModel)]="periodData.semester"
                  required>
                  <option value="">{{'DEPT-MANAGER.SELECT-SEMESTER' | translate}}</option>
                  <option value="1">{{'DEPT-MANAGER.WINTER' | translate}}</option>
                  <option value="2">{{'DEPT-MANAGER.SPRING' | translate}}</option>
                </select>
                <!-- <input type="text" class="form-control" id="staticEmail" placeholder="Tίτλος Περιόδου" value=""> -->
              </div>
            </div>
            <div class="form-group row">
              <label for="inputPassword" class="col-sm-2 col-form-label">{{'GENERIC.PERIOD-PHASE' | translate}}</label>
              <div class="btn-group dropup col-sm-10">
                <select class="custom-select" #selectPhase name="phase_state" [(ngModel)]="periodData.phase_state"
                  id="phase_state" (ngModelChange)="onPhaseChange($event)" required>
                  <option value="1" [disabled]="this.phaseBe4Update > 1 && this.depManagerData.id != adminUser">{{'DEPT-MANAGER.PHASE-1-INTEREST' | translate}}</option>
                  <option value="2">{{'DEPT-MANAGER.PHASE-2-SELECTION' | translate}}</option>
                </select>
              </div>
              <div *ngIf="phaseBe4Update > 1" class="text-danger"><br>{{'DEPT-MANAGER.CANNOT-RETURN-PHASE-1' | translate}}</div>
            </div>
            <div class="form-group row">
              <label for="inputPassword" class="col-sm-2 col-form-label">{{'DEPT-MANAGER.START' | translate}}</label>
              <div class="col-sm-10">
                <div class="pl-0 ml-0 input-group">
                  <input class="form-control" placeholder="dd/mm/yyyy" id="date_from" name="date_from" #c3="ngModel"
                    ngModel [(ngModel)]="periodData.date_from" ngbDatepicker #datepicker3="ngbDatepicker"
                    [placement]="'left'" [positionTarget]="buttonDateFrom"  [disabled]="periodData.phase_state == 1 && this.depManagerData.id != adminUser" required />
                  <button class="btn btn-outline-secondary" #buttonDateFrom (click)="datepicker3.toggle()"
                    type="button">
                    <i class="fas fa-calendar-alt"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="form-group row">
              <label for="inputPassword" class="col-sm-2 col-form-label">{{'DEPT-MANAGER.END' | translate}}</label>
              <div class="col-sm-10">
                <div class="pl-0 ml-0 input-group">
                  <input class="form-control" placeholder="dd/mm/yyyy" id="date_to" name="date_to" #c4="ngModel" ngModel
                    [(ngModel)]="periodData.date_to" ngbDatepicker #datepicker4="ngbDatepicker" [placement]="'left'"
                    [positionTarget]="buttonDateTo" [disabled]="periodData.phase_state == 1 && this.depManagerData.id != adminUser" required />
                  <button class="btn btn-outline-secondary" #buttonDateTo (click)="datepicker4.toggle()" type="button">
                    <i class="fas fa-calendar-alt"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="form-group row">
              <label for="positions" class="col-sm-2 col-form-label">{{'DEPT-MANAGER.ESPA-POSITIONS' | translate}}</label>
              <div class="col-sm-10">
                <input type="number" name="positions" id="positions" class="form-control" ngModel
                  [(ngModel)]="periodData.positions" placeholder="{{'GENERIC.POSITIONS-NUMBER' | translate}}" readonly required>
              </div>
            </div>
            <div class="form-group row">
              <label for="available_positions" class="col-sm-2 col-form-label">{{'DEPT-MANAGER.NON-ESPA-POSITIONS' | translate}}</label>
              <div class="col-sm-10">
                <input type="number" name="available_positions" ngModel #availablePositionsItem id="available_positions"
                  class="form-control" [(ngModel)]="periodData.available_positions" placeholder="{{'GENERIC.POSITIONS-NUMBER' | translate}}"
                  (input)="validateInputNumber(availablePositionsItem)" maxLength="5" required>
              </div>
            </div>
            <a (click)="back()" class="btn btn-secondary mr-2"> <i class="fas fa-angle-left"></i>
              {{'GENERIC.BACK' | translate}}</a>
            <button (click)="insertPhase2StudentsRank()" class="btn btn-primary">{{'GENERIC.SAVE' | translate}}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
